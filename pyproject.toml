[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilc-miner"
dynamic = ["version"]
description = "Machine-learning observables and inference workflows for ILC analyses"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.dynamic]
version = {attr = "ilc_miner.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ilc_miner*"]
